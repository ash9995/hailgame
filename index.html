<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي حائل الثقافي</title>
    <link rel="stylesheet" href="style.css">
    <!-- استخدام خطوط Google (مثل Tajawal) إذا لم يكن الخط المحلي متوفراً -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="puzzle-container">
        
        <!-- Game Header: Level & Score --><div class="game-header">
            <div class="level-indicator">
                <!-- تم تحديث عدد المراحل الكلي ليصبح ٦ -->
                <span>المرحلة: <span id="current-level">١</span> / ٦</span>
            </div>
            <div class="score-box">
                النقاط: <span id="score">٠</span>
            </div>
        </div>

        <!-- Progress Bar --><div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        
        <!-- العنوان الرئيسي وعنوان المرحلة -->
        <h1 id="main-title">تحدي بيوت الثقافة</h1>
        <p class="subtitle" id="level-title">المرحلة ١: معالم حائل التاريخية</p>

        <!-- Dynamic Game Area (هنا سيتم حقن الألغاز بواسطة JavaScript) --><div id="game-area" class="puzzle-grid">
            <!-- Puzzles will be injected here by JavaScript -->
            <!-- هذا القسم كان يحتوي على الألغاز المكتوبة يدوياً وتمت إزالتها -->
        </div>

        <!-- Victory Modal (Hidden by default) -->
        <div id="victory-modal" class="modal hidden">
            <div class="modal-content">
                <h2>كفو! 🎉</h2>
                <p>أجبت على جميع الأسئلة بشكل صحيح.</p>
                <div class="stars">⭐⭐⭐</div>
                <button id="next-level-btn" class="btn-hail">المرحلة التالية</button>
            </div>
        </div>

        <!-- Game Over / Final Win Modal -->
        <div id="final-modal" class="modal hidden">
            <div class="modal-content">
                <h2>يا بعد حيي! ❤️</h2>
                <p>ختمت اللعبة وتعرفت على تراثنا.</p>
                <div class="final-score">مجموع النقاط: <span id="final-score-display">0</span></div>
                <button onclick="location.reload()" class="btn-hail">العب مرة أخرى</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
