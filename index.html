<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي قصص الأطفال</title>
    <link rel="stylesheet" href="style.css">
    <!-- خطوط مساعدة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- الخلفية -->
    <div class="background-image"></div>

    <div class="puzzle-container">
        
        <!-- رأس اللعبة -->
        <div class="game-header">
            <div class="level-indicator">
                <!-- سيتم تحديث الرقم الكلي تلقائياً من الجافاسكريبت -->
                <span>المرحلة: <span id="current-level">١</span> / ٤</span>
            </div>
            <div class="score-box">
                النقاط: <span id="score">٠</span>
            </div>
        </div>

        <!-- شريط التقدم -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- العناوين -->
        <h1 id="main-title">تحدي قصص الأطفال</h1>
        <p class="subtitle" id="level-title">جاري تحميل الألغاز...</p>

        <!-- منطقة اللعب -->
        <div id="game-area" class="puzzle-grid"></div>

        <!-- نوافذ الفوز والنهاية -->
        <div id="victory-modal" class="modal hidden">
            <div class="modal-content">
                <h2>أحسنت يا بطل! 🌟</h2>
                <p>إجاباتك كلها صحيحة، أنت ذكي جداً!</p>
                <div class="stars">⭐⭐⭐</div>
                <button id="next-level-btn" class="btn-hail">المرحلة التالية</button>
            </div>
        </div>

        <div id="final-modal" class="modal hidden">
            <div class="modal-content">
                <h2>مبروك الختم! 👑</h2>
                <p>لقد أنهيت جميع مراحل القصص بنجاح.</p>
                <div class="final-score">مجموع النقاط: <span id="final-score-display">0</span></div>
                <button onclick="location.reload()" class="btn-hail">العب مرة أخرى</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
